<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Calculator body -->
  <rect x="30" y="20" width="140" height="160" rx="12" fill="white" stroke="white" stroke-width="2"/>
  
  <!-- Display screen -->
  <rect x="45" y="35" width="110" height="35" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="150" y="60" font-size="20" font-family="monospace" fill="#333" text-anchor="end" font-weight="bold">0</text>
  
  <!-- Button grid -->
  <!-- Row 1 -->
  <rect x="45" y="80" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="97" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">7</text>
  
  <rect x="72" y="80" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="83" y="97" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">8</text>
  
  <rect x="99" y="80" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="110" y="97" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">9</text>
  
  <rect x="126" y="80" width="29" height="22" rx="4" fill="#667eea" stroke="#667eea" stroke-width="1"/>
  <text x="140.5" y="97" font-size="14" font-family="Arial" fill="white" text-anchor="middle" font-weight="600">÷</text>
  
  <!-- Row 2 -->
  <rect x="45" y="108" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="125" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">4</text>
  
  <rect x="72" y="108" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="83" y="125" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">5</text>
  
  <rect x="99" y="108" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="110" y="125" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">6</text>
  
  <rect x="126" y="108" width="29" height="22" rx="4" fill="#667eea" stroke="#667eea" stroke-width="1"/>
  <text x="140.5" y="125" font-size="14" font-family="Arial" fill="white" text-anchor="middle" font-weight="600">×</text>
  
  <!-- Row 3 -->
  <rect x="45" y="136" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="153" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">1</text>
  
  <rect x="72" y="136" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="83" y="153" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">2</text>
  
  <rect x="99" y="136" width="22" height="22" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="110" y="153" font-size="12" font-family="Arial" fill="#333" text-anchor="middle" font-weight="600">3</text>
  
  <rect x="126" y="136" width="29" height="22" rx="4" fill="#667eea" stroke="#667eea" stroke-width="1"/>
  <text x="140.5" y="153" font-size="14" font-family="Arial" fill="white" text-anchor="middle" font-weight="600">−</text>
